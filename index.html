<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliFly | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Use Inter font */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Hide scrollbars if video slightly overflows */
        }

        /* Video Background Container */
        #video-bg {
            position: fixed; /* Fix position to cover viewport */
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100; /* Place behind content */
            background-size: cover;
            /* Optional: Add a fallback background image or color */
            background-color: #1a202c; /* Dark fallback */
        }

        /* Dark Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* Adjust opacity as needed */
            z-index: -50; /* Place above video, behind content */
        }

        /* Styling for the countdown timer numbers */
        .timer-number {
            font-size: 3rem; /* Larger font size for numbers (adjust as needed) */
            font-weight: 700; /* Bold weight */
            line-height: 1; /* Adjust line height */
        }

        /* Styling for the countdown timer labels */
        .timer-label {
            font-size: 0.8rem; /* Smaller font size for labels */
            text-transform: uppercase; /* Uppercase labels */
            letter-spacing: 0.1em; /* Add some letter spacing */
            margin-top: 0.25rem; /* Space above label */
        }

        /* Container for each timer segment (number + label) */
        .timer-segment {
             min-width: 90px; /* Ensure segments have some base width */
             text-align: center;
        }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-white"> <div id="video-bg">
        <video autoplay muted loop playsinline>
             <source src="DroneLinkAd.mp4" type="video/mp4">
             Your browser does not support the video tag.
        </video>
    </div>
    <div class="overlay"></div>

    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen p-8">

        <h1 class="text-6xl md:text-7xl font-bold mb-5">SimpliFly</h1>

        <p class="text-xl md:text-2xl text-gray-300 mb-12">Updated website coming soon</p>

        <div id="countdown" class="flex flex-wrap justify-center items-start gap-6 md:gap-10">
            <div class="timer-segment">
                <div id="days" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Days</div>
            </div>
            <div class="timer-segment">
                <div id="hours" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Hours</div>
            </div>
            <div class="timer-segment">
                <div id="minutes" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Minutes</div>
            </div>
            <div class="timer-segment">
                <div id="seconds" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Seconds</div>
            </div>
        </div>

        <footer class="absolute bottom-0 left-0 right-0 p-4 text-center text-gray-500 text-sm">
            &copy; <span id="year"></span> SimpliFly. All rights reserved.
        </footer>
    </div>

    <script>
        // --- Countdown Timer Logic ---

        // 1. Set the FIXED target date (June 1st, 2025, 00:00:00)
        // Note: JavaScript months are 0-indexed (0 = January, 5 = June)
        const targetDate = new Date(2025, 5, 1, 0, 0, 0);

        // Get elements
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownEl = document.getElementById('countdown');
        const yearEl = document.getElementById('year');

        // Set current year in footer
        if (yearEl) {
            yearEl.textContent = new Date().getFullYear(); // Get current year dynamically
        }

        // 2. Update countdown every second
        const interval = setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call

        function updateCountdown() {
            const currentTime = new Date().getTime();
            const timeDifference = targetDate - currentTime;

            // 3. Calculate time parts
            if (timeDifference <= 0) {
                clearInterval(interval);
                if (countdownEl) {
                    // Style the completion message to fit the new theme
                    countdownEl.innerHTML = '<div class="text-2xl font-semibold text-green-400">Our new website is launching soon!</div>';
                }
                // Ensure timer elements are cleared or set to 00
                if (daysEl) daysEl.textContent = '00';
                if (hoursEl) hoursEl.textContent = '00';
                if (minutesEl) minutesEl.textContent = '00';
                if (secondsEl) secondsEl.textContent = '00';
                return;
            }

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            // 4. Display time, add leading zeros
            if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
            if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
            if (minutesEl) minutesEl.textContent = String(minutes).padStart(2, '0');
            if (secondsEl) secondsEl.textContent = String(seconds).padStart(2, '0');
        }
    </script>

</body>
</html>
