<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliFly | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Use Inter font */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Hide scrollbars */
            background-color: #212936; /* Dark background */
        }
        #canvas-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -100; display: block;
        }
        .timer-number { font-size: 3rem; font-weight: 700; line-height: 1; }
        .timer-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem; }
        .timer-segment { min-width: 90px; text-align: center; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-white">

    <canvas id="canvas-bg"></canvas>

    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen p-8">
        <h1 class="text-6xl md:text-7xl font-bold mb-5">SimpliFly</h1>
        <p class="text-xl md:text-2xl text-gray-300 mb-12">Updated website coming soon</p>
        <div id="countdown" class="flex flex-wrap justify-center items-start gap-6 md:gap-10">
            <div class="timer-segment">
                <div id="days" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Days</div>
            </div>
            <div class="timer-segment">
                <div id="hours" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Hours</div>
            </div>
            <div class="timer-segment">
                <div id="minutes" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Minutes</div>
            </div>
            <div class="timer-segment">
                <div id="seconds" class="timer-number">00</div>
                <div class="timer-label text-gray-400">Seconds</div>
            </div>
        </div>
        <footer class="absolute bottom-0 left-0 right-0 p-4 text-center text-gray-500 text-sm">
            &copy; <span id="year"></span> SimpliFly. All rights reserved.
        </footer>
    </div>

    <script>
        // --- Countdown Timer Logic ---
        // (Same as before)
        const targetDate = new Date(2025, 5, 1, 0, 0, 0); // June 1st, 2025
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const countdownEl = document.getElementById('countdown');
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();
        const countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call is important
        function updateCountdown() {
            const currentTime = new Date().getTime();
            const timeDifference = targetDate - currentTime;
            if (timeDifference <= 0) {
                clearInterval(countdownInterval);
                if (countdownEl) countdownEl.innerHTML = '<div class="text-2xl font-semibold text-green-400">Our new website is launching soon!</div>';
                if (daysEl) daysEl.textContent = '00'; if (hoursEl) hoursEl.textContent = '00';
                if (minutesEl) minutesEl.textContent = '00'; if (secondsEl) secondsEl.textContent = '00';
                return;
            }
            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);
            if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
            if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
            if (minutesEl) minutesEl.textContent = String(minutes).padStart(2, '0');
            if (secondsEl) secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        // --- Contour Map Canvas Animation Logic ---
        const canvas = document.getElementById('canvas-bg');
        let ctx;
        let width, height;
        let noiseGen;
        let zOffset = 0;
        const noiseScale = 0.005;
        const timeScale = 0.005;
        // *** OPTIMIZATION: Reduced number of contours ***
        const numContours = 10; // Was 25
        const contourInterval = 1.0 / numContours;
        const contourColors = [
            'rgba(255, 255, 255, 0.3)', // White
            'rgba(156, 163, 175, 0.3)', // Grey
            'rgba(147, 197, 253, 0.35)', // Light Blue
            'rgba(255, 255, 255, 0.3)', // White
            'rgba(156, 163, 175, 0.3)', // Grey
        ];
        const lineThickness = 1.5;
        // *** OPTIMIZATION: Increased grid size (less detail, better performance) ***
        const resolution = 15; // Was 10
        let animationFrameId = null;

        function init() {
            try {
                if (!canvas) { console.error("Canvas element not found!"); return; }
                ctx = canvas.getContext('2d');
                if (!ctx) { console.error("Could not get 2D context!"); return; }

                if (typeof SimpleNoise === 'undefined' || typeof SimpleNoise.SimpleNoise === 'undefined') {
                     console.error("SimpleNoise constructor not found!");
                     if (typeof SimpleNoise === 'function') {
                         noiseGen = new SimpleNoise();
                     } else { return; }
                } else {
                    noiseGen = new SimpleNoise.SimpleNoise();
                }

                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                zOffset = Math.random() * 1000;

                if (animationFrameId === null) {
                    animate();
                }
            } catch (error) {
                console.error("Error during initialization:", error);
            }
        }

        function getNoiseValue(x, y, z) {
            if (!noiseGen || typeof noiseGen.noise3D !== 'function') { return 0; }
            return (noiseGen.noise3D(x * noiseScale, y * noiseScale, z * timeScale) + 1) / 2;
        }

        const interpolate = (p1, p2, val1, val2, level) => {
            if (Math.abs(val1 - val2) < 1e-6) return p1;
            const t = (level - val1) / (val2 - val1);
            const clampedT = Math.max(0, Math.min(1, t));
            return p1 + (p2 - p1) * clampedT;
        };

        function animate() {
            try {
                if (!ctx) { return; }

                ctx.fillStyle = '#212936';
                ctx.fillRect(0, 0, width, height);
                zOffset += 1;
                ctx.lineWidth = lineThickness;

                for (let i = 0; i < numContours; i++) {
                    const contourLevel = i * contourInterval;
                    ctx.strokeStyle = contourColors[i % contourColors.length];
                    ctx.beginPath();
                    // Loop uses the updated 'resolution' value here
                    for (let y = 0; y < height; y += resolution) {
                        for (let x = 0; x < width; x += resolution) {
                            const valTL = getNoiseValue(x, y, zOffset);
                            const valTR = getNoiseValue(x + resolution, y, zOffset);
                            const valBL = getNoiseValue(x, y + resolution, zOffset);
                            const valBR = getNoiseValue(x + resolution, y + resolution, zOffset);

                            let caseIndex = 0;
                            if (valTL > contourLevel) caseIndex |= 8;
                            if (valTR > contourLevel) caseIndex |= 4;
                            if (valBR > contourLevel) caseIndex |= 2;
                            if (valBL > contourLevel) caseIndex |= 1;

                            if (caseIndex === 0 || caseIndex === 15) continue;

                            const midTopX = interpolate(x, x + resolution, valTL, valTR, contourLevel);
                            const midRightY = interpolate(y, y + resolution, valTR, valBR, contourLevel);
                            const midBottomX = interpolate(x, x + resolution, valBL, valBR, contourLevel);
                            const midLeftY = interpolate(y, y + resolution, valTL, valBL, contourLevel);

                            // Marching squares logic (same as before)
                            switch (caseIndex) {
                                case 1: ctx.moveTo(x, midLeftY); ctx.lineTo(midBottomX, y + resolution); break;
                                case 2: ctx.moveTo(midBottomX, y + resolution); ctx.lineTo(x + resolution, midRightY); break;
                                case 3: ctx.moveTo(x, midLeftY); ctx.lineTo(x + resolution, midRightY); break;
                                case 4: ctx.moveTo(midTopX, y); ctx.lineTo(x + resolution, midRightY); break;
                                case 5: ctx.moveTo(x, midLeftY); ctx.lineTo(midTopX, y); ctx.moveTo(midBottomX, y + resolution); ctx.lineTo(x + resolution, midRightY); break;
                                case 6: ctx.moveTo(midTopX, y); ctx.lineTo(midBottomX, y + resolution); break;
                                case 7: ctx.moveTo(x, midLeftY); ctx.lineTo(midTopX, y); break;
                                case 8: ctx.moveTo(x, midLeftY); ctx.lineTo(midTopX, y); break;
                                case 9: ctx.moveTo(midTopX, y); ctx.lineTo(midBottomX, y + resolution); break;
                                case 10: ctx.moveTo(midTopX, y); ctx.lineTo(x + resolution, midRightY); ctx.moveTo(x, midLeftY); ctx.lineTo(midBottomX, y + resolution); break;
                                case 11: ctx.moveTo(midTopX, y); ctx.lineTo(x + resolution, midRightY); break;
                                case 12: ctx.moveTo(x, midLeftY); ctx.lineTo(x + resolution, midRightY); break;
                                case 13: ctx.moveTo(x, midLeftY); ctx.lineTo(midBottomX, y + resolution); break;
                                case 14: ctx.moveTo(midBottomX, y + resolution); ctx.lineTo(x + resolution, midRightY); break;
                            }
                        }
                    }
                    ctx.stroke();
                }
                animationFrameId = requestAnimationFrame(animate);
            } catch (error) {
                console.error("Error during animation loop:", error);
                if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            }
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            resizeTimeout = setTimeout(init, 100);
        });

        // Initialize after the page loads
        window.addEventListener('load', init);

    </script>

</body>
</html>
